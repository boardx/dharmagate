name: Cloud release-wave validation
on:
  push:
    branches: [codex/dharmagate-consolidation-20261029]
    paths: ['apps/web/src/legacy-theme-repair.mjs', 'apps/web/test/legacy-theme-repair.test.mjs', 'tools/release-wave/**', '.github/workflows/cloud-release-wave.yml']
  pull_request:
    paths: ['apps/web/src/legacy-theme-repair.mjs', 'apps/web/test/legacy-theme-repair.test.mjs', 'tools/release-wave/**', '.github/workflows/cloud-release-wave.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-wave-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - run: node --test tools/release-wave/gates.test.mjs apps/web/test/legacy-theme-repair.test.mjs
