name: Cloud content validation
on:
  push:
    branches: [codex/dharmagate-consolidation-20261029]
    paths: ['apps/web/src/canon*', 'apps/web/src/canon-experience/**', 'apps/web/src/full-canon-library.mjs', 'apps/web/src/discovery-shell.mjs', 'apps/web/src/tei-browser-reader.mjs', 'apps/web/test/canon*', 'apps/web/test/discovery-shell.test.mjs', 'apps/web/test/full-canon-library.test.mjs', 'tools/canon/tei-reader.py', 'tools/canon/test_tei_reader.py', 'tools/cloud-content/**', '.github/workflows/cloud-content.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm --prefix tools/cloud-content ci --ignore-scripts --offline --no-audit --no-fund
      - run: npm --prefix tools/cloud-content test
      - run: npm --prefix tools/cloud-content run build
